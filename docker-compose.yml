services:
  pao-tools:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: pao-tools:latest
    container_name: pao-tools-server
    
    # Required for GDB to work properly
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    
    # Security options
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - RUST_LOG=info
      - FASTMCP_DEBUG=false
      - FASTMCP_LOG_LEVEL=INFO
      - PAO_RUNTIME_ROOT=/var/lib/pao

    # Expose MCP HTTP port
    ports:
      - "127.0.0.1:5500:5500"
    
    # Volumes for persistent data and workspace
    volumes:
      - ./workspace:/workspace:rw
      - ./binaries:/binaries:ro
      - pao-runtime:/var/lib/pao
    
    # Working directory
    working_dir: /workspace
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5500/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 

volumes:
  pao-runtime:
