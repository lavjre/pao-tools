steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull us-central1-docker.pkg.dev/$PROJECT_ID/pao-tools/pao-tools || true

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/pao-tools/pao-tools',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/pao-tools/pao-tools',
        '.'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/pao-tools/pao-tools'

options:
  logging: CLOUD_LOGGING_ONLY
