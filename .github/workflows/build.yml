name: Build

on:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_rebuild: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: Detect docs-only changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: "every"
          filters: |
            non_docs:
              - "**"
              - "!docs/**"
              - "!assets/**"
              - "!**/*.md"
              - "!**/*.mdx"
              - "!LICENSE"
              - "!LICENSE.*"
  python:
    needs: changes
    if: ${{ needs.changes.outputs.should_rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run black
        run: uv run black --check .
      - name: Run mypy
        run: uv run mypy paomcp --ignore-missing-imports --disable-error-code=import-untyped
      - name: Run mypy (typed paocli surface)
        run: uv run mypy paocli/utils/doctor.py paocli/commands/cmd_doctor.py --ignore-missing-imports --disable-error-code=import-untyped
      - name: Check generated tool docs are fresh
        run: uv run python scripts/gen_tool_docs.py --check
      - name: Run pytest
        run: uv run pytest -v
  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.should_rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOT_CONTAINER: pao-tools-ci-boot-${{ github.run_id }}-${{ github.run_attempt }}
      BOOT_VOLUME: pao-ci-boot-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      STAGE5_VOLUME: pao-ci-stage5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      STAGE6_9_VOLUME: pao-ci-stage6-9-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pao-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot default entrypoint and probe health
        run: |
          docker run -d --name "$BOOT_CONTAINER" \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${BOOT_VOLUME}:/var/lib/pao" \
            pao-tools:ci

          healthy=0
          for attempt in $(seq 1 60); do
            if docker exec "$BOOT_CONTAINER" \
              curl -fsS http://127.0.0.1:5500/healthz >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$BOOT_CONTAINER")" != "true" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != "1" ]]; then
            docker logs "$BOOT_CONTAINER"
            exit 1
          fi
          docker exec "$BOOT_CONTAINER" \
            curl -fsS http://127.0.0.1:5500/healthz
          docker exec -i "$BOOT_CONTAINER" /app/.venv/bin/python - <<'PY'
          import asyncio

          from fastmcp import Client

          EXPECTED_STAGE5_TOOLS = {
              "run_until_crash",
              "capture_crash_snapshot",
              "analyze_crash",
              "classify_crash",
              "compare_crashes",
              "find_cyclic_offset",
              "capture_core_dump",
              "generate_crash_report",
          }


          async def verify_stage5_tools() -> None:
              async with Client("http://127.0.0.1:5500/mcp") as client:
                  tools = await client.list_tools()
              names = {tool.name for tool in tools}
              missing = EXPECTED_STAGE5_TOOLS - names
              if missing:
                  raise RuntimeError(
                      f"HTTP MCP is missing Stage 5 tools: {sorted(missing)}"
                  )
              print(f"HTTP MCP Stage 5 tools ready: {sorted(EXPECTED_STAGE5_TOOLS)}")


          asyncio.run(verify_stage5_tools())
          PY
      - name: Remove entrypoint smoke resources
        if: always()
        run: |
          docker rm -f "$BOOT_CONTAINER" || true
          docker volume rm -f "$BOOT_VOLUME" || true
      - name: Run stage5 smoke test
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${STAGE5_VOLUME}:/var/lib/pao" \
            --entrypoint /app/.venv/bin/python \
            pao-tools:ci \
            /app/tests/docker_stage5_smoke.py
      - name: Remove smoke evidence volume
        if: always()
        run: docker volume rm -f "$STAGE5_VOLUME" || true
      - name: Run stage6-9 smoke test
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${STAGE6_9_VOLUME}:/var/lib/pao" \
            --entrypoint /app/.venv/bin/python \
            pao-tools:ci \
            /app/tests/docker_stage6_9_smoke.py
      - name: Remove stage6-9 smoke resources
        if: always()
        run: docker volume rm -f "$STAGE6_9_VOLUME" || true
