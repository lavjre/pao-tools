name: Publish GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  # Release tags share mutable aliases (`latest`, major, and minor). Serialize
  # every publication in this repository so an older build cannot finish last
  # and overwrite aliases produced by a newer release.
  group: publish-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_rebuild: ${{ steps.decision.outputs.should_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: "every"
          filters: |
            non_docs:
              - "**"
              - "!docs/**"
              - "!assets/**"
              - "!**/*.md"
              - "!**/*.mdx"
              - "!LICENSE"
              - "!LICENSE.*"
      - name: Decide whether rebuild is needed
        id: decision
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "should_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_rebuild=${{ steps.filter.outputs.non_docs }}" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.should_rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run black
        run: uv run black --check .
      - name: Run mypy
        run: uv run mypy paomcp --ignore-missing-imports --disable-error-code=import-untyped
      - name: Run pytest
        run: uv run pytest -v
  publish:
    needs:
      - changes
      - verify
    if: ${{ needs.changes.outputs.should_rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BOOT_CONTAINER: pao-tools-publish-boot-${{ github.run_id }}-${{ github.run_attempt }}
      BOOT_VOLUME: pao-publish-boot-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      STAGE5_VOLUME: pao-publish-stage5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      STAGE6_9_VOLUME: pao-publish-stage6-9-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}},prefix=sha-
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build exact image for smoke and publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            pao-tools:publish-smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot default entrypoint and probe health
        env:
          PAO_ALLOW_REMOTE: "1"
          PAO_MCP_TOKEN: pao-publish-smoke-token
        run: |
          docker run -d --name "$BOOT_CONTAINER" \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e PAO_ALLOW_REMOTE=1 \
            -e PAO_MCP_TOKEN="$PAO_MCP_TOKEN" \
            -v "${BOOT_VOLUME}:/var/lib/pao" \
            pao-tools:publish-smoke

          healthy=0
          for attempt in $(seq 1 60); do
            if docker exec "$BOOT_CONTAINER" \
              curl -fsS http://127.0.0.1:5500/healthz >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$BOOT_CONTAINER")" != "true" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != "1" ]]; then
            docker logs "$BOOT_CONTAINER"
            exit 1
          fi
          docker exec "$BOOT_CONTAINER" \
            curl -fsS http://127.0.0.1:5500/healthz
          docker exec -i "$BOOT_CONTAINER" /app/.venv/bin/python - <<'PY'
          import asyncio
          import os

          from fastmcp import Client
          from fastmcp.client.auth import BearerAuth

          EXPECTED_STAGE5_TOOLS = {
              "run_until_crash",
              "capture_crash_snapshot",
              "analyze_crash",
              "classify_crash",
              "compare_crashes",
              "find_cyclic_offset",
              "capture_core_dump",
              "generate_crash_report",
          }


          async def verify_stage5_tools() -> None:
              async with Client(
                  "http://127.0.0.1:5500/mcp",
                  auth=BearerAuth(os.environ["PAO_MCP_TOKEN"]),
              ) as client:
                  tools = await client.list_tools()
              names = {tool.name for tool in tools}
              missing = EXPECTED_STAGE5_TOOLS - names
              if missing:
                  raise RuntimeError(
                      f"HTTP MCP is missing Stage 5 tools: {sorted(missing)}"
                  )
              print(f"HTTP MCP Stage 5 tools ready: {sorted(EXPECTED_STAGE5_TOOLS)}")


          asyncio.run(verify_stage5_tools())
          PY
      - name: Remove entrypoint smoke resources
        if: always()
        run: |
          docker rm -f "$BOOT_CONTAINER" || true
          docker volume rm -f "$BOOT_VOLUME" || true
      - name: Run stage5 smoke test
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${STAGE5_VOLUME}:/var/lib/pao" \
            --entrypoint /app/.venv/bin/python \
            pao-tools:publish-smoke \
            /app/tests/docker_stage5_smoke.py
      - name: Remove smoke evidence volume
        if: always()
        run: docker volume rm -f "$STAGE5_VOLUME" || true
      - name: Run stage6-9 smoke test
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${STAGE6_9_VOLUME}:/var/lib/pao" \
            --entrypoint /app/.venv/bin/python \
            pao-tools:publish-smoke \
            /app/tests/docker_stage6_9_smoke.py
      - name: Remove stage6-9 smoke resources
        if: always()
        run: docker volume rm -f "$STAGE6_9_VOLUME" || true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the smoke-tested image
        run: docker push --all-tags "${IMAGE_NAME}"
