[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pao-tools"
version = "0.3.0"
description = "MCP server for autonomous low-level security research with pwndbg"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
authors = [
    {name = "Pao Tools"},
]
dependencies = [
    "click>=8.1.0",
    "fastmcp>=3.1.0,<4",
    "pygdbmi>=0.11.0.0",
    "psutil>=5.9.0",
    "pyelftools>=0.32,<0.33",
    "rich>=14.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pwntools>=4.14.1",
    "requests>=2.31.0",
    "ropper>=1.13.13",
]

[project.scripts]
paocli = "paocli.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "mypy",
    "types-psutil",
    "types-requests",
]

[tool.setuptools]
# Package discovery is constrained below so tests are not shipped in wheels.

[tool.setuptools.packages.find]
include = ["paomcp*", "paocli*"]

[tool.setuptools.package-data]
paocli = ["conf/*", "conf/.*", "LICENSE"]
paomcp = ["tools/backends/ghidra_scripts/*.java"]
